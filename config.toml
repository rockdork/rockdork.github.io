# 三言二鱼
baseURL = 'https://rockdork.github.io/'
languageCode = 'zh-CN'
title = '三言二鱼'

# 基本配置
description = '三言两语，记录真实思考'
summaryLength = 80

# 外观设置
[params]
  defaultTheme = 'light'
  ShowReadingTime = false
  ShowPostNavLinks = true
  ShowToc = true
  DateFormat = '2006/01/02'
  mainSections = ["posts"]

  # 搜索
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# 菜单
[[menu.main]]
  identifier = "posts"
  name = "博客"
  url = "/posts/"
  weight = 1

[[menu.main]]
  identifier = "works"
  name = "作品"
  url = "/works/"
  weight = 2

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 3

[[menu.main]]
  identifier = "search"
  name = "🔍"
  url = "/search/"
  weight = 4

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 5

# Markdown 配置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokailight"
    lineNos = false
    codeFences = true
    guessSyntax = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

# 输出格式
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 分页
[pagination]
  pagerSize = 10
