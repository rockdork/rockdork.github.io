# 三言二鱼
baseURL = 'https://rockdork.github.io/'
languageCode = 'zh-CN'
title = '三言二鱼'
theme = 'PaperMod'

# 基本配置
author = ''
description = '记录思考与发现'
summaryLength = 50

# 外观设置
[params]
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButton = true
  ShowTaxonomies = true

  [params.homeInfoParams]
    Title = '三言二鱼'
    Content = '记录思考与发现'

  mainSections = ["posts"]

# 菜单
[[menu.main]]
  identifier = "posts"
  name = "博客"
  url = "/posts/"
  weight = 1

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 2

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 3

# Markdown 配置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

# 输出格式
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 分页
[pagination]
  pagerSize = 7

# 图片处理
[imaging]
  quality = 85
  resampleFilter = "Lanczos"
