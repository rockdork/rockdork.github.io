# 三言二鱼 - 石柱的个人网站
baseURL = 'https://rockdork.github.io/'
languageCode = 'zh-CN'
title = '三言二鱼'
theme = 'PaperMod'

# 基本配置
author = '石柱'
description = '石柱的个人网站'
summaryLength = 50

# 外观设置
[params]
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButton = true
  ShowTaxonomies = true

  [params.homeInfoParams]
    Title = '三言二鱼'
    Content = '石柱的个人空间，记录思考与发现。'

  [params.profileMode]
    enabled = true
    title = "石柱"
    subtitle = "思考者 | 记录者"
    imageUrl = "img/profile.jpg"
    imageTitle = "我的头像"
    imageWidth = 120
    imageHeight = 120

    [[params.profileMode.buttons]]
      name = "博客"
      url = "/posts"
    [[params.profileMode.buttons]]
      name = "标签"
      url = "/tags"
    [[params.profileMode.buttons]]
      name = "关于"
      url = "/about"

# 菜单
[[menu.main]]
  identifier = "posts"
  name = "博客"
  url = "/posts/"
  weight = 1

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 2

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 3

# Markdown 配置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

# 输出格式
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 分页
[pagination]
  pagerSize = 7

# 图片处理
[imaging]
  quality = 85
  resampleFilter = "Lanczos"
