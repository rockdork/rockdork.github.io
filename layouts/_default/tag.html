{{- define "main" }}

<header class="page-header">
    <h1>{{ .Title }}</h1>
</header>

{{- range .Pages }}
<article class="post-card">
    <a class="card-link" href="{{ .Permalink }}" aria-label="阅读 {{ .Title }}"></a>
    <h2>{{ .Title }}</h2>
    {{- if .Summary }}
    <p class="card-summary">{{ .Summary | plainify | htmlUnescape }}{{ if .Truncated }}...{{ end }}</p>
    {{- end }}
    <div class="card-meta">
        <time>{{ .Date | time.Format "2006/01/02" }}</time>
    </div>
</article>
{{- end }}

{{- end }}
