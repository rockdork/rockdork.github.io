<nav class="pagination" role="navigation" aria-label="Pagination">
  {{ if .Paginator.HasPrev }}
  <a href="{{ .Paginator.Prev.URL }}" class="pagination-item pagination-prev">← 上一页</a>
  {{ end }}
  <span class="pagination-item pagination-active">{{ .Paginator.PageNumber }} / {{ .Paginator.TotalPages }}</span>
  {{ if .Paginator.HasNext }}
  <a href="{{ .Paginator.Next.URL }}" class="pagination-item pagination-next">下一页 →</a>
  {{ end }}
</nav>
