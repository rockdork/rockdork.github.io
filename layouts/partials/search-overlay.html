{{- /* Search overlay - injected via partial, shown on demand */ -}}
<div id="searchOverlay" class="search-overlay" aria-hidden="true">
  <div class="search-overlay-backdrop" onclick="closeSearch()"></div>
  <div class="search-overlay-content">
    <div class="search-overlay-box">
      <div class="search-overlay-input-wrap">
        <svg class="search-overlay-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="searchOverlayInput" type="search" placeholder="搜索文章..." autocomplete="off" maxlength="64" aria-label="搜索">
        <button class="search-overlay-close" onclick="closeSearch()" aria-label="关闭搜索">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <ul id="searchOverlayResults" class="search-overlay-results"></ul>
      <div class="search-overlay-footer">
        <kbd>↵</kbd> 打开 · <kbd>↑↓</kbd> 选择 · <kbd>Esc</kbd> 关闭
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  let fuse = null;
  const overlay = document.getElementById('searchOverlay');
  const input = document.getElementById('searchOverlayInput');
  const resultsList = document.getElementById('searchOverlayResults');
  let first, last, currentElem = null;
  let resultsAvailable = false;

  // Load Fuse index
  fetch('/index.json')
    .then(res => res.json())
    .then(data => {
      if (data) {
        const fuseOpts = {{ .Site.Params.fuseOpts | jsonify | safeJS }};
        const options = fuseOpts ? {
          isCaseSensitive: fuseOpts.iscasesensitive || false,
          includeScore: fuseOpts.includescore || false,
          includeMatches: fuseOpts.includematches || false,
          minMatchCharLength: fuseOpts.minmatchcharlength || 1,
          shouldSort: fuseOpts.shouldsort !== undefined ? fuseOpts.shouldsort : true,
          findAllMatches: fuseOpts.findallmatches || false,
          keys: fuseOpts.keys || ['title', 'permalink', 'summary', 'content'],
          location: fuseOpts.location || 0,
          threshold: fuseOpts.threshold || 0.4,
          distance: fuseOpts.distance || 100,
          ignoreLocation: fuseOpts.ignorelocation !== undefined ? fuseOpts.ignorelocation : true
        } : {
          distance: 100,
          threshold: 0.4,
          ignoreLocation: true,
          keys: ['title', 'permalink', 'summary', 'content']
        };
        fuse = new Fuse(data, options);
      }
    })
    .catch(err => console.error('Search index load failed:', err));

  // Open / Close
  window.openSearch = function() {
    overlay.classList.add('active');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    setTimeout(() => input.focus(), 50);
  };

  window.closeSearch = function() {
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    input.value = '';
    resultsList.innerHTML = '';
    resultsAvailable = false;
  };

  // Keyboard shortcut: Ctrl/Cmd + K or /
  document.addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      if (overlay.classList.contains('active')) {
        closeSearch();
      } else {
        openSearch();
      }
      return;
    }
    if (e.key === 'Escape' && overlay.classList.contains('active')) {
      closeSearch();
      return;
    }
    // Arrow & Enter navigation when overlay is active
    if (!overlay.classList.contains('active')) return;
    const ae = document.activeElement;
    const inBox = document.querySelector('.search-overlay-box').contains(ae);
    if (!inBox && !currentElem) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (ae === input && first) {
        activateItem(first.querySelector('a'));
      } else if (currentElem && currentElem.parentElement !== last) {
        activateItem(currentElem.parentElement.nextSibling.querySelector('a'));
      }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (currentElem && currentElem.parentElement === first) {
        input.focus();
        currentElem = null;
        clearFocus();
      } else if (currentElem) {
        activateItem(currentElem.parentElement.previousSibling.querySelector('a'));
      }
    } else if (e.key === 'Enter' && currentElem) {
      e.preventDefault();
      currentElem.click();
    }
  });

  function activateItem(ae) {
    clearFocus();
    ae.focus();
    currentElem = ae;
    ae.parentElement.classList.add('focus');
  }

  function clearFocus() {
    document.querySelectorAll('.search-overlay-results .focus').forEach(el => el.classList.remove('focus'));
  }

  // Search input
  input.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === 'Escape') return;
    if (!fuse) return;

    const query = this.value.trim();
    if (!query) {
      resultsList.innerHTML = '';
      resultsAvailable = false;
      return;
    }

    const limit = {{ .Site.Params.fuseOpts.limit | default 10 }};
    const results = fuse.search(query, { limit: limit });

    if (results.length > 0) {
      let html = '';
      for (const item of results) {
        const r = item.item;
        html += `<li>
          <a href="${r.permalink}">
            <span class="search-result-title">${r.title}</span>
            <span class="search-result-summary">${r.summary || ''}</span>
          </a>
        </li>`;
      }
      resultsList.innerHTML = html;
      resultsAvailable = true;
      first = resultsList.firstChild;
      last = resultsList.lastChild;
    } else {
      resultsList.innerHTML = '<li class="search-no-result">没有找到相关内容</li>';
      resultsAvailable = false;
    }
  });

  input.addEventListener('search', function() {
    if (!this.value) {
      resultsList.innerHTML = '';
      resultsAvailable = false;
    }
  });
})();
</script>
