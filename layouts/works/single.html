{{- define "main" }}

<main class="page-main">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>

  {{ .Content }}

  <div class="works-page">
    <div class="works-category">
      <h2 class="works-category-title">✍️ 公众号</h2>
      <div class="works-grid">
        <a class="works-card" href="https://mp.weixin.qq.com/s/抓手" target="_blank" rel="noopener">
          <div class="works-card-header">
            <h3>三言二鱼</h3>
            <span class="works-status">持续更新</span>
          </div>
          <p class="works-desc">三言两语，鱼游深水。个人成长与感悟类内容，简短记录，但不止于表面。</p>
          <div class="works-tags">
            <span class="works-tag">个人成长</span>
            <span class="works-tag">感悟</span>
            <span class="works-tag">写作</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</main>

{{- end }}
