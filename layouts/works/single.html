{{- define "main" }}

<main class="page-main">
  <header class="page-header">
    <h1>作品</h1>
  </header>

  {{ .Content }}

  <div class="works-showcase">

    <!-- 1. lumi 拾光日记 (Lumi Diary) -->
    <a class="work-card" href="https://gitee.com/rockdorky/lumi-diary-releases/releases" target="_blank" rel="noopener">
      <div class="work-card-icon" style="background: transparent; box-shadow: 0 4px 14px -2px rgba(0,0,0,0.08);">
        <svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" style="border-radius: 22.37%;">
          <defs>
            <linearGradient id="w-d1-bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FCFCFC"/>
              <stop offset="1" stop-color="#F2F2F0"/>
            </linearGradient>
            <linearGradient id="w-d1-moon" x1="292" y1="292" x2="732" y2="732" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2D3139"/>
              <stop offset="1" stop-color="#181A20"/>
            </linearGradient>
          </defs>
          <rect width="1024" height="1024" rx="224" fill="url(#w-d1-bg)"/>
          <rect width="1024" height="1024" rx="224" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="4"/>
          <circle cx="512" cy="512" r="280" fill="none" stroke="#1F2937" stroke-width="14" stroke-opacity="0.12" stroke-dasharray="8 12"/>
          <path d="M512 292C390.5 292 292 390.5 292 512C292 633.5 390.5 732 512 732C500 660 520 580 570 520C620 460 700 440 732 440C700 350 615 292 512 292Z" fill="url(#w-d1-moon)"/>
          <circle cx="670" cy="370" r="24" fill="#EAB308"/>
        </svg>
      </div>
      <div class="work-card-body">
        <div class="work-card-header">
          <h3 class="work-card-title">lumi 拾光日记</h3>
          <span class="work-status">v0.2.4</span>
        </div>
        <p class="work-card-desc">本地优先个人日记与生活打点工具。晨昏晓月，日夜相伴。</p>
        <div class="work-card-meta">
          <span class="work-tag">macOS</span>
          <span class="work-tag">Android</span>
          <span class="work-tag">本地优先</span>
        </div>
      </div>
      <div class="work-card-action">
        <span>下载</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </div>
    </a>

    <!-- 2. lumi 三言笔记 (Lumi Note) -->
    <a class="work-card" href="https://gitee.com/rockdorky/lumi-note-releases/releases" target="_blank" rel="noopener">
      <div class="work-card-icon" style="background: transparent; box-shadow: 0 4px 14px -2px rgba(0,0,0,0.08);">
        <svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" style="border-radius: 22.37%;">
          <defs>
            <linearGradient id="w-o-bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FCFCFC"/>
              <stop offset="1" stop-color="#F2F2F0"/>
            </linearGradient>
            <linearGradient id="w-o-leaf" x1="512" y1="210" x2="654" y2="700" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2D3139"/>
              <stop offset="1" stop-color="#181A20"/>
            </linearGradient>
          </defs>
          <rect width="1024" height="1024" rx="224" fill="url(#w-o-bg)"/>
          <rect width="1024" height="1024" rx="224" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="4"/>
          <circle cx="512" cy="512" r="280" fill="none" stroke="#1F2937" stroke-width="14" stroke-opacity="0.12" stroke-dasharray="8 12"/>
          <path d="M440 680C420 510 500 370 660 300C670 420 630 570 480 670C460 680 440 680 440 680Z" fill="url(#w-o-leaf)"/>
          <path d="M440 680C360 560 390 440 480 410C450 510 460 600 440 680Z" fill="#1E293B" fill-opacity="0.14"/>
          <circle cx="680" cy="280" r="24" fill="#EAB308"/>
        </svg>
      </div>
      <div class="work-card-body">
        <div class="work-card-header">
          <h3 class="work-card-title">lumi 三言笔记</h3>
          <span class="work-status">v0.1.2</span>
        </div>
        <p class="work-card-desc">极简卡片笔记工具。破土灵芽，自然生长。即开即记，双向链接。</p>
        <div class="work-card-meta">
          <span class="work-tag">macOS</span>
          <span class="work-tag">Android</span>
          <span class="work-tag">本地优先</span>
        </div>
      </div>
      <div class="work-card-action">
        <span>下载</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </div>
    </a>

    <!-- 3. 三言图图 -->
    <a class="work-card" href="https://tutu.rockdork.cn/about" target="_blank" rel="noopener">
      <div class="work-card-icon">🖼️</div>
      <div class="work-card-body">
        <div class="work-card-header">
          <h3 class="work-card-title">三言图图</h3>
          <span class="work-status">v0.2.10</span>
        </div>
        <p class="work-card-desc">轻量云图床上传工具，多存储支持与快速拖拽分发。</p>
        <div class="work-card-meta">
          <span class="work-tag">图床</span>
          <span class="work-tag">工具</span>
        </div>
      </div>
      <div class="work-card-action">
        <span>访问</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </div>
    </a>

    <!-- 4. 开源项目 -->
    <a class="work-card" href="https://github.com/rockdork" target="_blank" rel="noopener">
      <div class="work-card-icon">🐙</div>
      <div class="work-card-body">
        <div class="work-card-header">
          <h3 class="work-card-title">开源项目</h3>
          <span class="work-status">GitHub</span>
        </div>
        <p class="work-card-desc">个人开源项目与日常折腾的脚本集合。</p>
        <div class="work-card-meta">
          <span class="work-tag">开源</span>
          <span class="work-tag">代码</span>
        </div>
      </div>
      <div class="work-card-action">
        <span>查看</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>

    </a>

  </div>
</main>
