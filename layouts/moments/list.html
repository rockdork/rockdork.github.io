{{ define "main" }}
<main class="page-main">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  <div class="moments-grid">
    {{ range .Paginator.Pages }}
    <article class="moment-card {{ if not .Params.featured_image }}no-cover{{ end }}">
      <a href="{{ .RelPermalink }}" class="moment-card-link">
        {{ with .Params.featured_image }}
        <div class="moment-cover">
          <img src="{{ . | relURL }}" alt="{{ .Title }}" onerror="this.parentElement.classList.add('cover-fallback')">
        </div>
        {{ end }}
        <div class="moment-meta">
          <h2 class="moment-title">{{ .Title }}</h2>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006/01/02" }}</time>
        </div>
      </a>
    </article>
    {{ end }}
  </div>
  {{ partial "pagination.html" . }}
</main>
<script>
// 图片加载失败时优雅降级
document.querySelectorAll('.moment-cover img').forEach(img => {
  img.addEventListener('error', function() {
    this.parentElement.classList.add('cover-fallback');
  });
});
</script>
{{ end }}
